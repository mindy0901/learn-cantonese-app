services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: cantonese
            POSTGRES_PASSWORD: cantonese
            POSTGRES_DB: cantonese
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        restart: unless-stopped

    libretranslate:
        # Image chính thức + named volume model + healthcheck (theo doc "With Docker").
        # https://docs.libretranslate.com/guides/installation/ (2026-08-25)
        # ⚠️ Override entrypoint → chạy `libretranslate` TRỰC TIẾP (KHÔNG gunicorn):
        # gunicorn `--max-requests 250` restart worker → reload model CTranslate2 → segfault
        # (WSL2/Docker Desktop) → container unhealthy. Chạy trực tiếp = 1 process, hết crash. (2026-08-25)
        image: libretranslate/libretranslate:latest
        restart: unless-stopped
        ports:
            - "${LIBRETRANSLATE_PORT:-5000}:5000"
        entrypoint:
            ["./venv/bin/libretranslate", "--host", "0.0.0.0", "--load-only", "en,vi,zh", "--disable-files-translation"]
        # Giữ model trong volume → không tải lại mỗi lần recreate container.
        volumes:
            - libretranslate_models:/home/libretranslate/.local:rw
        healthcheck:
            test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
            interval: 10s
            timeout: 4s
            retries: 4
            start_period: 5s

    backend:
        build:
            context: ./backend
            target: dev
        env_file:
            - .env.dev
        environment:
            DATABASE_URL: postgres://cantonese:cantonese@db:5432/cantonese
            BACKEND_HOST: 0.0.0.0
            BACKEND_PORT: ${BACKEND_PORT:-3001}
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/auth/google/callback}
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
            LIBRETRANSLATE_URL: http://libretranslate:5000
        ports:
            - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
        volumes:
            - ./backend:/app
            - backend_node_modules:/app/node_modules
        depends_on:
            - db
            - libretranslate
        restart: unless-stopped

    studio:
        build:
            context: ./backend
            target: dev
        env_file:
            - .env.dev
        environment:
            DATABASE_URL: postgres://cantonese:cantonese@db:5432/cantonese
        ports:
            - "5555:5555"
        volumes:
            - ./backend:/app
            - backend_node_modules:/app/node_modules
        depends_on:
            - db
        command: sh -c "cd /app && npx prisma studio --port 5555 --browser none"
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            target: dev
        environment:
            VITE_BACKEND_URL: http://backend:${BACKEND_PORT:-3001}
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"
            VITE_HMR_HOST: localhost
            FRONTEND_PORT: ${FRONTEND_PORT:-5173}
        ports:
            - "${FRONTEND_PORT:-5173}:5173"
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        depends_on:
            - backend
        restart: unless-stopped

volumes:
    pgdata:
    backend_node_modules:
    frontend_node_modules:
    libretranslate_models:
