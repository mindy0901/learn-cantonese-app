services:
    # ⚠️ 2026-09-19: ĐÃ XÓA service `db` (Postgres local) — app dùng SUPABASE
    # (xem `DATABASE_URL` trong `.env.dev`). Snapshot cuối cùng của DB local đã được dump ra
    # `backend/_local-snapshot-2026-09-19.dump` (pg_dump -Fc, gitignored) nếu cần restore tạm:
    #   docker run --rm -d --name pg-tmp -e POSTGRES_USER=cantonese -e POSTGRES_PASSWORD=cantonese -e POSTGRES_DB=cantonese -p 5432:5432 postgres:16-alpine
    #   docker exec -i pg-tmp pg_restore -U cantonese -d cantonese --no-owner < backend/_local-snapshot-2026-09-19.dump
    libretranslate:
        # Image chính thức + named volume model + healthcheck (theo doc "With Docker").
        # https://docs.libretranslate.com/guides/installation/ (2026-08-25)
        # ⚠️ Override entrypoint → chạy `libretranslate` TRỰC TIẾP (KHÔNG gunicorn):
        # gunicorn `--max-requests 250` restart worker → reload model CTranslate2 → segfault
        # (WSL2/Docker Desktop) → container unhealthy. Chạy trực tiếp = 1 process, hết crash. (2026-08-25)
        image: libretranslate/libretranslate:latest
        restart: unless-stopped
        ports:
            - "${LIBRETRANSLATE_PORT:-5000}:5000"
        entrypoint:
            ["./venv/bin/libretranslate", "--host", "0.0.0.0", "--load-only", "en,vi,zh", "--disable-files-translation"]
        # Giữ model trong volume → không tải lại mỗi lần recreate container.
        volumes:
            - libretranslate_models:/home/libretranslate/.local:rw
        healthcheck:
            test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
            interval: 10s
            timeout: 4s
            retries: 4
            start_period: 5s

    backend:
        # ⚠️ 2026-09-19: tag `:dev` riêng — trước đây build prod (docker-compose.yml) ghi đè
        # `learn-cantonese-app-backend:latest` → container dev chạy nhầm image prod.
        image: learn-cantonese-app-backend:dev
        build:
            context: ./backend
            target: dev
        env_file:
            - .env.dev
        environment:
            # ⚠️ 2026-09-19: KHÔNG hardcode DATABASE_URL ở đây nữa — DB lấy từ `.env.dev`
            # (hiện = Supabase session pooler). Trước đây override `postgres://…@db:5432`
            # khiến container luôn nói DB local dù .env.dev đổi.
            BACKEND_HOST: 0.0.0.0
            BACKEND_PORT: ${BACKEND_PORT:-3001}
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/auth/google/callback}
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
            LIBRETRANSLATE_URL: http://libretranslate:5000
        ports:
            - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
        volumes:
            - ./backend:/app
            - backend_node_modules:/app/node_modules
        depends_on:
            - libretranslate
        restart: unless-stopped

    frontend:
        # ⚠️ 2026-09-19: tag `:dev` riêng — trước đây build prod (`docker-compose.yml`) ghi đè
        # `learn-cantonese-app-frontend:latest` → container dev chạy nginx (image prod) thay vì Vite.
        image: learn-cantonese-app-frontend:dev
        build:
            context: ./frontend
            target: dev
        environment:
            VITE_BACKEND_URL: http://backend:${BACKEND_PORT:-3001}
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"
            VITE_HMR_HOST: localhost
            FRONTEND_PORT: ${FRONTEND_PORT:-5173}
        ports:
            - "${FRONTEND_PORT:-5173}:5173"
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        depends_on:
            - backend
        restart: unless-stopped

volumes:
    backend_node_modules:
    frontend_node_modules:
    libretranslate_models:
