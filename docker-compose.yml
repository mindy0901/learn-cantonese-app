services:
    backend:
        # ⚠️ 2026-09-19: tag `:prod` riêng — tránh ghi đè image dev (cùng project name → cùng tag `:latest`).
        image: learn-cantonese-app-backend:prod
        build:
            context: ./backend
            target: runner
        env_file:
            - .env.prod
        environment:
            BACKEND_HOST: 0.0.0.0
            BACKEND_PORT: ${BACKEND_PORT:-3001}
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
        expose:
            - "${BACKEND_PORT:-3001}"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    frontend:
        # ⚠️ 2026-09-19: tag `:prod` riêng — tránh ghi đè image dev (`learn-cantonese-app-frontend:dev`).
        image: learn-cantonese-app-frontend:prod
        build:
            context: ./frontend
            target: runner
            args:
                VITE_API_URL: ""
        ports:
            - "${FRONTEND_PORT:-8080}:80"
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped
