<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        /* Pre-hydration boot fallback: a single spinner centered on the app
           background (theme-matched) so there is no white flash while the JS
           bundle loads. Colors mirror globals.css tokens.
           ⚠️ 2026-09-20: đây là LOADER DUY NHẤT của lần tải đầu — nằm NGOÀI #root
           (React không xoá khi mount) và được AuthGate.removeBootFallback() gỡ khi
           app đã có dữ liệu. */
        #boot-fallback {
            position: fixed;
            inset: 0;
            z-index: 9999;
            margin: 0;
            padding: 2.5rem 1.5rem;
            /* = Tailwind p-8 px-6 @ 20px root */
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: oklch(1 0 0);
            color: oklch(0.508 0.118 165.612);
            /* = --primary (light) */
        }

        html.dark #boot-fallback {
            background: oklch(0.148 0.004 228.8);
            color: oklch(0.432 0.095 166.913);
            /* = --primary (dark) */
        }

        .boot-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: boot-spin 0.8s linear infinite;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        // Apply saved theme before first paint so the boot fallback (and app)
        // doesn't flash the wrong background.
        try {
            var s = JSON.parse(localStorage.getItem("cantonese-app-ui") || "{}");
            if (s.theme === "dark" || s.theme === "light") {
                document.documentElement.classList.toggle("dark", s.theme === "dark");
            }
        } catch (e) { /* ignore */ }

        // Safety net: nếu vì lý do gì đó app không gỡ được spinner (route lỗi/404,
        // hydrate treo) → tự gỡ sau 12s để không khoá màn hình vĩnh viễn.
        setTimeout(function () {
            var el = document.getElementById("boot-fallback");
            if (el) el.remove();
        }, 12000);
    </script>
    <title>3107Hanzi</title>
</head>

<body>
    <p id="boot-fallback" role="status" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
    </p>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
